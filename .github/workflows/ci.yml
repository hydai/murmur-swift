name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MurmurKit Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Cache SwiftPM build artefacts
        uses: actions/cache@v6
        with:
          path: MurmurKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('MurmurKit/Package.swift', 'MurmurKit/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: swift-format lint
        run: swift format lint --recursive Sources Tests
        working-directory: MurmurKit
        continue-on-error: true

      - name: Run tests
        run: swift test
        working-directory: MurmurKit

  build:
    name: Xcode Build
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Cache Xcode artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ hashFiles('Murmur.xcodeproj/project.pbxproj') }}
          restore-keys: |
            xcode-${{ runner.os }}-

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Murmur.xcodeproj -scheme Murmur

      - name: Build Murmur.app
        run: |
          xcodebuild \
            -project Murmur.xcodeproj \
            -scheme Murmur \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
